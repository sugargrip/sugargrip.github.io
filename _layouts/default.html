<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
{% if page.description %}
<meta name="description" content="{{ page.description }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
{% endif %}
<style>
  body { max-width: 38rem; margin: 3rem auto; padding: 0 1.25rem; color: #222;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  h1 { font-size: 1.7rem; margin-bottom: .25rem; }
  h2 { font-size: 1.1rem; margin-top: 2.25rem; }
  a { color: #a8501f; }
  hr { border: 0; border-top: 1px solid #ddd; margin: 3rem 0 1rem; }
  footer { font-size: .85rem; color: #666; }

  /* landing page only */
  body.home { max-width: 52rem; margin-top: 4.5rem; }
  .hero { text-align: center; }
  .hero h1 { font-size: clamp(2.6rem, 8vw, 3.6rem); line-height: 1.05;
             letter-spacing: -.035em; margin: 0 0 .75rem; }
  .lede { font-size: clamp(1.2rem, 3.4vw, 1.5rem); line-height: 1.35; font-weight: 500;
          letter-spacing: -.015em; margin: 0 0 1.25rem; }
  .sub { max-width: 31rem; margin: 0 auto; color: #5b5b5b; }
  .badge { margin-top: 2.25rem; }
  .badge a { display: inline-block; transition: transform .15s ease; }
  .badge a:hover { transform: scale(1.04); }
  .badge img { height: 64px; width: auto; display: block; }
  /* five shots side by side would land at ~150px each — scroll instead, three
     visible plus a peek of the fourth as the scroll affordance */
  .shots { display: flex; gap: 1.1rem; margin: 4rem 0 4.5rem;
           overflow-x: auto; scroll-snap-type: x mandatory;
           -webkit-overflow-scrolling: touch; }
  .shots img { flex: 0 0 30%; min-width: 0; width: 100%; height: auto;
               scroll-snap-align: center;
               border-radius: 18px; border: 1px solid #e6e6e6;
               box-shadow: 0 6px 28px rgba(0,0,0,.10); }
  /* columns, not grid: h2 and p are siblings, so grid cells would split each
     heading from its own paragraph */
  .features { columns: 2; column-gap: 3rem; }
  .features h2 { font-size: 1.15rem; letter-spacing: -.01em; margin: 0 0 .4rem;
                 break-after: avoid; -webkit-column-break-after: avoid; }
  .features p { margin: 0 0 2rem; color: #444;
                break-inside: avoid; -webkit-column-break-inside: avoid; }
  .contact { margin-top: 3.5rem; text-align: center; color: #5b5b5b; }
  @media (max-width: 34rem) {
    .features { columns: 1; }
    .badge img { height: 56px; }
    /* on a phone, widen each shot so one is actually legible */
    .shots { gap: .75rem; margin: 2.5rem -1.25rem 3rem; padding: 0 1.25rem;
             scrollbar-width: none; }
    .shots::-webkit-scrollbar { display: none; }
    .shots img { flex: 0 0 62%; border-radius: 14px; }
  }

  @media (prefers-color-scheme: dark) {
    body { background: #131313; color: #ddd; }
    a { color: #e8a06a; }
    hr { border-top-color: #333; }
    footer { color: #888; }
    .sub, .contact { color: #a0a0a0; }
    .features p { color: #bbb; }
    .shots img { border-color: #2c2c2c; box-shadow: 0 6px 28px rgba(0,0,0,.5); }
  }
</style>
</head>
<body class="{{ page.body_class }}">
{{ content }}
<hr>
<footer><a href="/privacy-policy">Privacy Policy</a> &middot; <a href="/support">Support</a></footer>
</body>
</html>
